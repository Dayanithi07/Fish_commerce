<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VP Aquarium - healthy, hand-raised pet fish and premium aquarium food delivered with expert care support." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <link rel="apple-touch-icon" href="/images/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>VP Aquarium | Premium Pet Fish & Aquatics</title>
    <style>
      /* Ultra-fast pure CSS preloader before React loads */
      .vp-initial-loader {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 40%, #0c1a2e 0%, #030a14 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #ffffff;
      }
      .vp-spinner-wrap {
        position: relative;
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
      }
      .vp-spinner-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(14, 165, 233, 0.15);
        border-top-color: #0284c7;
        border-right-color: #38bdf8;
        animation: vpSpin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }
      .vp-spinner-inner {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(2, 132, 199, 0.25), rgba(56, 189, 248, 0.15));
        display: flex;
        align-items: center;
        justify-content: center;
        animation: vpPulse 1.8s ease-in-out infinite;
      }
      .vp-brand-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #ffffff 40%, #bae6fd 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 6px 0;
      }
      .vp-brand-sub {
        font-size: 13px;
        color: rgba(186, 230, 253, 0.75);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-weight: 600;
      }
      @keyframes vpSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes vpPulse {
        0%, 100% { transform: scale(0.92); opacity: 0.7; }
        50% { transform: scale(1.08); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="vp-initial-loader">
        <div class="vp-spinner-wrap">
          <div class="vp-spinner-ring"></div>
          <div class="vp-spinner-inner">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12c.6.5 1.2.8 2.5.8 2.5 0 2.5-1.6 5-1.6 2.5 0 2.5 1.6 5 1.6 2.5 0 2.5-1.6 5-1.6 1.3 0 1.9.3 2.5.8" />
              <path d="M2 6c.6.5 1.2.8 2.5.8 2.5 0 2.5-1.6 5-1.6 2.5 0 2.5 1.6 5 1.6 2.5 0 2.5-1.6 5-1.6 1.3 0 1.9.3 2.5.8" />
              <path d="M2 18c.6.5 1.2.8 2.5.8 2.5 0 2.5-1.6 5-1.6 2.5 0 2.5 1.6 5 1.6 2.5 0 2.5-1.6 5-1.6 1.3 0 1.9.3 2.5.8" />
            </svg>
          </div>
        </div>
        <h2 class="vp-brand-title">VP Aquarium</h2>
        <span class="vp-brand-sub">Healthy Fish & Aquatics</span>
      </div>
    </div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
