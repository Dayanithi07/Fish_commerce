<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VP Aquarium - healthy, hand-raised pet fish and premium aquarium food delivered with expert care support." />
    <meta name="theme-color" content="#3C1E5E" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <link rel="apple-touch-icon" href="/images/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>VP Aquarium | Premium Pet Fish & Aquatics</title>
    <style>
      /* Ultra-fast pure CSS preloader before React loads */
      .vp-initial-loader {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 40%, #1a1236 0%, #0d091e 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #ffffff;
      }
      .vp-spinner-wrap {
        position: relative;
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
      }
      .vp-spinner-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(168, 85, 247, 0.15);
        border-top-color: #8b5cf6;
        border-right-color: #06b6d4;
        animation: vpSpin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }
      .vp-spinner-inner {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(6, 182, 212, 0.2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        animation: vpPulse 1.8s ease-in-out infinite;
      }
      .vp-brand-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #ffffff 40%, #c4b5fd 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 6px 0;
      }
      .vp-brand-sub {
        font-size: 13px;
        color: rgba(228, 213, 249, 0.75);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-weight: 600;
      }
      @keyframes vpSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes vpPulse {
        0%, 100% { transform: scale(0.92); opacity: 0.7; }
        50% { transform: scale(1.08); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="vp-initial-loader">
        <div class="vp-spinner-wrap">
          <div class="vp-spinner-ring"></div>
          <div class="vp-spinner-inner">🐟</div>
        </div>
        <h2 class="vp-brand-title">VP Aquarium</h2>
        <span class="vp-brand-sub">Healthy Fish & Aquatics</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
