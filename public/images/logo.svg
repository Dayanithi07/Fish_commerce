<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="10" y1="30" x2="110" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9b4dff"/>
      <stop offset="55%" stop-color="#6F3FF5"/>
      <stop offset="100%" stop-color="#3a9bff"/>
    </linearGradient>
    <linearGradient id="g2" x1="20" y1="60" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9b4dff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="fishGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Circular arc -->
  <circle cx="58" cy="66" r="48" stroke="url(#g3)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="240 62" fill="none" filter="url(#glow)" transform="rotate(-40 58 66)"/>
  <!-- Tail fin -->
  <path d="M28 72 C18 55, 14 85, 26 92 C34 100, 24 110, 36 108 C46 106, 38 88, 44 80" fill="url(#g2)" filter="url(#fishGlow)" opacity="0.92"/>
  <!-- Ventral fin -->
  <path d="M50 82 C44 95, 36 105, 48 110 C56 113, 58 100, 60 90" fill="url(#g2)" opacity="0.80"/>
  <!-- Dorsal fin -->
  <path d="M55 50 C50 36, 42 28, 52 24 C60 20, 64 36, 64 48" fill="url(#g2)" opacity="0.85"/>
  <!-- Body -->
  <ellipse cx="62" cy="68" rx="22" ry="14" fill="url(#g1)" filter="url(#fishGlow)"/>
  <!-- Head -->
  <ellipse cx="80" cy="66" rx="10" ry="10" fill="url(#g1)"/>
  <!-- Eye -->
  <circle cx="84" cy="63" r="4.5" fill="#0d0d2b"/>
  <circle cx="84" cy="63" r="2.5" fill="#1a1a4e"/>
  <circle cx="85.5" cy="61.5" r="1.2" fill="white" opacity="0.9"/>
  <!-- Mouth -->
  <path d="M91 68 Q95 70 91 72" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Pectoral fin -->
  <path d="M72 72 C76 80, 68 88, 64 82" fill="url(#g2)" opacity="0.75"/>
  <!-- Bubbles -->
  <circle cx="98" cy="22" r="6.5" fill="none" stroke="url(#g3)" stroke-width="2" opacity="0.90" filter="url(#glow)"/>
  <circle cx="96" cy="20" r="2" fill="white" opacity="0.4"/>
  <circle cx="108" cy="36" r="4.5" fill="none" stroke="url(#g3)" stroke-width="1.8" opacity="0.80" filter="url(#glow)"/>
  <circle cx="107" cy="34.5" r="1.4" fill="white" opacity="0.4"/>
  <circle cx="103" cy="50" r="3" fill="none" stroke="url(#g3)" stroke-width="1.5" opacity="0.70" filter="url(#glow)"/>
  <circle cx="102.5" cy="49" r="1" fill="white" opacity="0.35"/>
</svg>
